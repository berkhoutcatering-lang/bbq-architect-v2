# Promptfoo eval — allergen-queue Server Actions
# Pillar #2 (Allergeen-cascade audit-bewijs) verifies dat:
#   1. /api/detect-allergens met component_id ECHT naar component_allergens schrijft
#      met ai_suggested=true (hard-rule 2 compliant)
#   2. Daarna niets ge-confirmed is (confirmed_at IS NULL)
#   3. /api/detect-allergens zonder component_id het legacy gedrag behoudt (return-only)
#
# Server Actions zelf (confirm/reject/bulkConfirm) zijn niet via Promptfoo HTTP testbaar
# omdat ze 'use server' formdata flow gebruiken — die test je via Playwright/E2E.
#
# Hoe te draaien:
#   PROMPTFOO_BASE_URL=http://localhost:62157 promptfoo eval -c evals/allergen-queue-actions.eval.yaml

description: "Pillar #2 — detect-allergens persisted_count en hard-rule 2 compliance"

providers:
  - id: http
    config:
      url: "{{env.PROMPTFOO_BASE_URL || 'http://localhost:62157'}}/api/detect-allergens"
      method: POST
      headers:
        Content-Type: application/json
      body: |
        {
          "ingredients": {{ingredients | dump}},
          "dish_name": "{{dish_name}}"{{#component_id}}, "component_id": {{component_id}}{{/component_id}}
        }
      responseParser: "json"

tests:
  - description: "Allergen-detect zonder component_id: legacy flow (no persist)"
    vars:
      dish_name: "Pulled Pork Brioche"
      ingredients:
        - "Boston butt"
        - "Brioche bun"
        - "Mosterd"
        - "Honing"
    assert:
      - type: javascript
        # Allergens minstens 'G' (gluten van brioche) + 'M' (mosterd)
        value: |
          if (!Array.isArray(output.allergens)) return false;
          return output.allergens.includes('G') && output.allergens.includes('M');
      - type: javascript
        # persisted_count MAG NIET in response zitten zonder component_id
        value: "!('persisted_count' in output)"
      - type: javascript
        # success=true
        value: "output.success === true"

  - description: "Allergen-detect MET component_id: persist naar component_allergens"
    vars:
      dish_name: "Brioche bun component test"
      ingredients:
        - "Bloem"
        - "Eieren"
        - "Boter"
      component_id: 999999  # bestaat niet → upsert moet falen via RLS of FK; persisted_count=0
    assert:
      - type: javascript
        # persisted_count veld MOET in response zitten met component_id
        value: "'persisted_count' in output || 'error' in output"
      - type: javascript
        # success=true (zelfs als component_id niet bestaat — upsert is geen hard-fail)
        value: "output.success === true || output.error"

  - description: "Allergen-detect leeg ingredients-array: empty allergens, no error"
    vars:
      dish_name: "Edge case"
      ingredients: []
    assert:
      - type: javascript
        value: "output.success === true && Array.isArray(output.allergens) && output.allergens.length === 0"

  - description: "Hard-rule 2 guard: ai-text mag GEEN nieuwe codes verzinnen buiten set"
    vars:
      dish_name: "Soja-test"
      ingredients:
        - "Soja saus"
        - "Tempeh"
    assert:
      - type: javascript
        # Allergens moeten uit gesloten set [G,L,N,V,VE,E,S,F,M] komen
        value: |
          const valid = new Set(['G','L','N','V','VE','E','S','F','M']);
          return output.allergens.every(c => valid.has(c));
      - type: javascript
        # Soja saus = S én G (gluten in soja saus)
        value: "output.allergens.includes('S') && output.allergens.includes('G')"
