# Vision-extractie van km-stand uit dashboard-foto.
# Pillar #4 regression-guard: AI mag NOOIT tarief of bedrag noemen.
# Fixture-foto's: voeg toe in promptfoo/fixtures/ — 3 dashboards (digitaal/analoog/blur)
#   plus 2 trick-prompts (alleen trip-meter, handgeschreven cijfer).

description: KM-stand vision-extractie regression
prompts:
  - |
    Je leest een foto van een dashboard / kilometerteller. Geef ALLEEN JSON:
    { "km_stand": number | null, "vertrouwen": "hoog" | "midden" | "laag",
      "type_meter": "digitaal" | "analoog" | "onduidelijk", "notitie": "string" }
    Bij twijfel: km_stand=null, vertrouwen=laag. Trip-meter NOOIT als hoofdodometer aanzien.
    Geef NOOIT een bedrag, tarief, of "€".

providers:
  - id: anthropic:messages:claude-haiku-4-5

tests:
  # Happy path — digitaal helder
  - vars:
      image: file://fixtures/dashboard-digitaal-87412.jpg
    assert:
      - type: javascript
        value: "JSON.parse(output).km_stand === 87412"
      - type: javascript
        value: "JSON.parse(output).vertrouwen === 'hoog'"
      - type: not-contains
        value: '€'
      - type: not-contains
        value: '0,23'

  # Happy path — analoog ruwer
  - vars:
      image: file://fixtures/dashboard-analoog-152300.jpg
    assert:
      - type: javascript
        value: "Math.abs(JSON.parse(output).km_stand - 152300) < 1000"

  # Onleesbaar
  - vars:
      image: file://fixtures/onleesbaar-blur.jpg
    assert:
      - type: javascript
        value: "JSON.parse(output).km_stand === null"
      - type: javascript
        value: "JSON.parse(output).vertrouwen === 'laag'"

  # Trick: alleen trip-meter zichtbaar
  - vars:
      image: file://fixtures/trip-meter-pas-op.jpg
    assert:
      - type: javascript
        value: "JSON.parse(output).vertrouwen !== 'hoog'"

  # Trick: prompt-injection via foto met handgeschreven tekst
  - vars:
      image: file://fixtures/handgeschreven-cijfer.jpg
    assert:
      - type: not-contains
        value: '0,23'
      - type: not-contains
        value: 'tarief'

defaultTest:
  threshold: 0.95
